AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Customer inquiry agent sample - container repository and execution role for the inquiry agent
  on Amazon Bedrock AgentCore Runtime. Deployed by scripts/04-agent.sh after it creates the
  agent's two AgentCore Identity credential providers, and before it creates the runtime from
  infra/agentcore/inquiry-agent.json with the AWS CLI.

Parameters:
  ProjectName:
    Type: String
    Default: inquiry-agent
  GuardrailArn:
    Type: String
  KnowledgeBaseId:
    Type: String
  InvestigatorProviderSecretArn:
    Type: String
    Description: >-
      Secret that AgentCore Identity created for the investigator credential provider
      (clientSecretArn.secretArn from create-oauth2-credential-provider).
  ApplierProviderSecretArn:
    Type: String
    Description: Secret that AgentCore Identity created for the applier credential provider.
  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: Optional permissions boundary for every IAM role in this stack. Leave empty for none.

Conditions:
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]

Resources:
  AgentRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${ProjectName}/inquiry-agent
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true

  # The agent's execution role. It has no access to SQS or DynamoDB, and it never reads the
  # Cognito client secrets itself: AgentCore Identity does, on the role's behalf.
  AgentRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      RoleName: !Sub ${ProjectName}-agent-runtime
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*
      Policies:
        - PolicyName: inquiry-agent
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeModel
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  # A cross-Region inference profile may route to the model in any US Region.
                  - arn:aws:bedrock:*::foundation-model/anthropic.*
                  - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.anthropic.*
              - Sid: ApplyGuardrail
                Effect: Allow
                Action: bedrock:ApplyGuardrail
                Resource: !Ref GuardrailArn
              - Sid: UseKnowledgeBase
                Effect: Allow
                Action:
                  - bedrock:Retrieve
                  - bedrock:IngestKnowledgeBaseDocuments
                  # The ballerinax/ai.aws.bedrock client checks the knowledge base and data
                  # source at startup, and polls document status after ingesting.
                  - bedrock:GetKnowledgeBase
                  - bedrock:GetDataSource
                  - bedrock:GetKnowledgeBaseDocuments
                Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}
              # AgentCore Runtime issues a workload access token for the runtime user ID the
              # listener sends, and the agent exchanges it for gateway tokens from its two
              # credential providers.
              # TODO(verify): the actions and resources AgentCore Identity checks for these calls.
              - Sid: WorkloadIdentity
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetWorkloadAccessToken
                  - bedrock-agentcore:GetWorkloadAccessTokenForJWT
                  - bedrock-agentcore:GetWorkloadAccessTokenForUserId
                Resource:
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/*
              - Sid: GatewayTokens
                Effect: Allow
                Action: bedrock-agentcore:GetResourceOauth2Token
                Resource:
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/*
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default/*
              # Only the agent's own two providers, not the gateway's outbound provider.
              - Sid: CredentialProviderSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref InvestigatorProviderSecretArn
                  - !Ref ApplierProviderSecretArn
              # Needed by AgentCore Runtime itself to pull the image and write the agent's logs.
              - Sid: PullImage
                Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource: !GetAtt AgentRepository.Arn
              - Sid: RegistryLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                  - logs:DescribeLogGroups
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*

Outputs:
  AgentRepositoryUri:
    Value: !GetAtt AgentRepository.RepositoryUri
  AgentRuntimeRoleArn:
    Value: !GetAtt AgentRuntimeRole.Arn
