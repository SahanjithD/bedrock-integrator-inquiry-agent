AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Customer inquiry agent sample - container repository and execution role for the inquiry agent
  on Amazon Bedrock AgentCore Runtime. Deployed by scripts/04-agent.sh, which then creates the
  runtime from infra/agentcore/inquiry-agent.json with the AWS CLI.

Parameters:
  ProjectName:
    Type: String
    Default: inquiry-agent
  FoundationStackName:
    Type: String
    Default: inquiry-agent-foundation
  GuardrailArn:
    Type: String
  KnowledgeBaseId:
    Type: String

Resources:
  AgentRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${ProjectName}/inquiry-agent
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true

  # The agent's execution role. It has no access to SQS or DynamoDB.
  AgentRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-agent-runtime
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*
      Policies:
        - PolicyName: inquiry-agent
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeModel
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  # A cross-Region inference profile may route to the model in any US Region.
                  - arn:aws:bedrock:*::foundation-model/anthropic.*
                  - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.anthropic.*
              - Sid: ApplyGuardrail
                Effect: Allow
                Action: bedrock:ApplyGuardrail
                Resource: !Ref GuardrailArn
              - Sid: UseKnowledgeBase
                Effect: Allow
                Action:
                  - bedrock:Retrieve
                  - bedrock:IngestKnowledgeBaseDocuments
                  # The ballerinax/ai.aws.bedrock client checks the knowledge base and data
                  # source at startup, and polls document status after ingesting.
                  - bedrock:GetKnowledgeBase
                  - bedrock:GetDataSource
                  - bedrock:GetKnowledgeBaseDocuments
                Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}
              - Sid: ReadGatewayClientSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  Fn::ImportValue: !Sub ${FoundationStackName}-GatewayClientSecretsArn
              # Needed by AgentCore Runtime itself to pull the image and write the agent's logs.
              - Sid: PullImage
                Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource: !GetAtt AgentRepository.Arn
              - Sid: RegistryLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                  - logs:DescribeLogGroups
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*

Outputs:
  AgentRepositoryUri:
    Value: !GetAtt AgentRepository.RepositoryUri
  AgentRuntimeRoleArn:
    Value: !GetAtt AgentRuntimeRole.Arn
