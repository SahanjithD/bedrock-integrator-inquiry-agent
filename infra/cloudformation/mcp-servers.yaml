AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Customer inquiry agent sample - container repositories and IAM roles for the reservation,
  loyalty and payment MCP servers on Amazon Bedrock AgentCore Runtime, and for AgentCore
  Gateway. Deployed by scripts/03-mcp-servers.sh, which then creates the runtimes, the
  gateway and its targets with the AWS CLI.

Parameters:
  ProjectName:
    Type: String
    Default: inquiry-agent
  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: Optional permissions boundary for every IAM role in this stack. Leave empty for none.

Conditions:
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]

Resources:
  ReservationMcpRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${ProjectName}/reservation-mcp
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true

  LoyaltyMcpRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${ProjectName}/loyalty-mcp
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true

  PaymentMcpRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${ProjectName}/payment-mcp
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true

  McpServerRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      RoleName: !Sub ${ProjectName}-mcp-runtime
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*
      Policies:
        - PolicyName: mcp-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PullImages
                Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource:
                  - !GetAtt ReservationMcpRepository.Arn
                  - !GetAtt LoyaltyMcpRepository.Arn
                  - !GetAtt PaymentMcpRepository.Arn
              - Sid: RegistryLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                  - logs:DescribeLogGroups
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*
              - Sid: Traces
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"
              - Sid: Metrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: bedrock-agentcore
              - Sid: WorkloadIdentity
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetWorkloadAccessToken
                  - bedrock-agentcore:GetWorkloadAccessTokenForJWT
                Resource:
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/*

  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      RoleName: !Sub ${ProjectName}-gateway
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*
      Policies:
        # TODO(verify): the exact actions the gateway needs to fetch outbound OAuth tokens
        # from AgentCore Identity for MCP server targets.
        - PolicyName: outbound-oauth
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:GetWorkloadAccessToken
                  - bedrock-agentcore:GetResourceOauth2Token
                Resource:
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/*
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default/*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:bedrock-agentcore-identity!*

Outputs:
  ReservationMcpRepositoryUri:
    Value: !GetAtt ReservationMcpRepository.RepositoryUri
  LoyaltyMcpRepositoryUri:
    Value: !GetAtt LoyaltyMcpRepository.RepositoryUri
  PaymentMcpRepositoryUri:
    Value: !GetAtt PaymentMcpRepository.RepositoryUri
  McpServerRuntimeRoleArn:
    Value: !GetAtt McpServerRuntimeRole.Arn
  GatewayRoleArn:
    Value: !GetAtt GatewayRole.Arn
